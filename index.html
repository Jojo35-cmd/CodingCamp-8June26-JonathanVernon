<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>

    <header>
      <h1>Expense &amp; Budget Visualizer</h1>
    </header>

    <main>

      <!-- ============================================================
           Section 1: Balance Display
           Shows the running total of all transaction amounts.
           TODO (Task 1.3): Populate with <span id="balance-amount">
           ============================================================ -->
      <section id="balance-section" aria-labelledby="balance-heading">
        <h2 id="balance-heading">Total Balance</h2>
        <p class="balance-display">Total: <span id="balance-amount">$0.00</span></p>
      </section>

      <!-- ============================================================
           Section 2: Input Form
           Fields for name, amount, category and a submit button.
           TODO (Task 1.3): Add <form id="transaction-form"> with
                            name-input, amount-input, category-select
           ============================================================ -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="name-input">Item Name</label>
            <input type="text" id="name-input" name="name" required
                   minlength="1" maxlength="100"
                   placeholder="e.g. Lunch" />
          </div>
          <div class="form-group">
            <label for="amount-input">Amount</label>
            <input type="number" id="amount-input" name="amount" required
                   step="0.01" min="0.01" max="999999999.99"
                   placeholder="0.00" />
          </div>
          <div class="form-group">
            <label for="category-select">Category</label>
            <select id="category-select" name="category" required>
              <option value="" disabled selected>Select a category</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
          </div>
          <button type="submit">Add Transaction</button>
        </form>
      </section>

      <!-- ============================================================
           Section 3: Transaction List
           Scrollable list of all recorded expense entries.
           TODO (Task 1.4): Add <ul id="transaction-list"> here
           ============================================================ -->
      <section id="list-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list"></ul>
      </section>

      <!-- ============================================================
           Section 4: Chart
           Chart.js canvas for the category spending pie chart.
           TODO (Task 1.5): Add <canvas id="expense-chart"> here
           ============================================================ -->
      <section id="chart-section" aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <canvas id="expense-chart" role="img" aria-label="Spending by category pie chart"></canvas>
      </section>

    </main>

    <script src="js/app.js" defer></script>

  </body>
</html>
